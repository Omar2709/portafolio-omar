<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <title>Mensaje enviado | Omar López</title>

    <meta
        name="theme-color"
        content="#0b1120"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 30px;

            display: grid;
            place-items: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(56, 189, 248, 0.12),
                    transparent 45%
                ),
                #0b1120;

            color: #e5e7eb;
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
        }

        .card {
            width: min(100%, 650px);
            padding: 55px 40px;

            background: #111a2e;
            border: 1px solid #263247;
            border-radius: 20px;

            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .symbol {
            width: 76px;
            height: 76px;
            margin: 0 auto 26px;

            display: grid;
            place-items: center;

            background: rgba(34, 197, 94, 0.1);
            border: 2px solid #22c55e;
            border-radius: 50%;

            color: #22c55e;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .label {
            color: #38bdf8;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin-top: 18px;

            color: #ffffff;
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            line-height: 1.15;
        }

        p {
            max-width: 520px;
            margin: 24px auto 0;

            color: #a8b3c7;
            font-size: 1rem;
            line-height: 1.8;
        }

        a {
            min-height: 48px;
            margin-top: 32px;
            padding: 12px 24px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: #38bdf8;
            border-radius: 9px;

            color: #07131a;
            font-weight: 700;
            text-decoration: none;

            transition:
                background-color 0.3s ease,
                transform 0.3s ease;
        }

        a:hover {
            background: #7dd3fc;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .card {
                padding: 42px 24px;
            }

            a {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div
            class="symbol"
            aria-hidden="true"
        >
            ✓
        </div>

        <p class="label">
            Mensaje enviado
        </p>

        <h1>
            Gracias por contactarme
        </h1>

        <p>
            El formulario se envió correctamente. Revisaré tu
            mensaje y responderé mediante el correo proporcionado.
        </p>

        <a href="/">
            Volver al portafolio
        </a>
    </main>
</body>
</html>
